[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcflow"
version = "0.1.0"
description = "Patient-aware breast cancer scRNA-seq, spatial and bulk RNA-seq workflows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3",
  "matplotlib==3.10.3", "seaborn==0.13.2", "scikit-learn==1.6.1",
  "statsmodels==0.14.4", "anndata==0.11.4", "scanpy==1.11.2",
  "pydeseq2==0.5.2", "igraph==0.11.9", "leidenalg==0.10.2",
  "umap-learn==0.5.7", "numba==0.61.2", "pynndescent==0.5.13",
  "PyYAML==6.0.2", "requests==2.32.3"
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]
workflow = ["snakemake==8.30.0"]
[project.scripts]
bcflow = "bcflow.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
